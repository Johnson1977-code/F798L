# BT
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_NUS=y
CONFIG_BT_DEVICE_NAME="F798L_ST7801N"
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# 新版 NCS/Zephyr NUS 正确符号
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_ZEPHYR_NUS_DEFAULT_INSTANCE=y

# Display
CONFIG_DISPLAY=y
CONFIG_INPUT=y

CONFIG_MSPI=y
CONFIG_MSPI_NRF_SQSPI=y

# LVGL（保守内存）
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_LV_Z_VDB_SIZE=8
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=2048

# 堆/栈
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# 屏驱动开关
CONFIG_DISPLAY_ST7801N=y